// You may write any gradle buildscript component in this file
// This file is automatically applied after build.gradle + dependencies.gradle is ran

// If you wish to use the default helper methods, uncomment the line below
// apply from: 'gradle/scripts/helpers.gradle'

// Isolated observation mod; neither its classes nor its property enter the distributable.
sourceSets {
    jafsValidation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    spellStaminaValidation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    setworksValidation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
    statusworksValidation {
        compileClasspath += sourceSets.main.compileClasspath
    }
    statusworksReplay {
        java.srcDirs('dev/statusworks-proof/src/main/java', 'dev/statusworks-proof/src/productionReplay/java')
        resources.srcDirs('dev/statusworks-proof/src/main/resources', 'dev/statusworks-proof/src/productionReplay/resources')
        compileClasspath += sourceSets.main.compileClasspath
    }
}
tasks.register('jafsValidationJar', Jar) {
    dependsOn tasks.named('jafsValidationClasses')
    archiveBaseName.set('jawms-integrations-jafs-validation')
    archiveVersion.set('dev')
    destinationDirectory.set(layout.buildDirectory.dir('validation'))
    from sourceSets.jafsValidation.output
}
def jafsProbeEnabled = (findProperty('enable_jafs_validation_probe') ?: 'false').toString().toBoolean()
tasks.register('prepareJafsValidationProbe') {
    if (jafsProbeEnabled) dependsOn tasks.named('jafsValidationJar')
    doLast {
        if (!jafsProbeEnabled) {
            delete layout.projectDirectory.file('run/mods/jawms-integrations-jafs-validation-dev.jar')
            return
        }
        if (!(propertyString('integration_runtime_profile') in ['jafs', 'all'])) {
            throw new GradleException('JAFS validation probe requires the jafs or all runtime profile')
        }
        copy {
            from tasks.named('jafsValidationJar').get().archiveFile
            into layout.projectDirectory.dir('run/mods')
        }
    }
}
tasks.named('runClient').configure { dependsOn tasks.named('prepareJafsValidationProbe') }

tasks.register('spellStaminaValidationJar', Jar) {
    dependsOn tasks.named('spellStaminaValidationClasses')
    archiveBaseName.set('jawms-integrations-stamina-validation')
    archiveVersion.set('dev')
    destinationDirectory.set(layout.buildDirectory.dir('validation'))
    from sourceSets.spellStaminaValidation.output
}

tasks.named('compileSetworksValidationJava', JavaCompile).configure {
    sourceCompatibility = targetCompatibility = 8
    options.compilerArgs += ['-proc:none']
}
def setworksValidationJar = tasks.register('setworksValidationJar', Jar) {
    dependsOn tasks.named('setworksValidationClasses')
    archiveBaseName.set('jawms-integrations-setworks-validation')
    archiveVersion.set('1.0')
    archiveClassifier.set('dev')
    destinationDirectory.set(layout.buildDirectory.dir('validation'))
    from sourceSets.setworksValidation.output
    manifest.attributes('MixinConfigs': 'mixins.setworksvalidation.json')
}
tasks.named('reobfSetworksValidationJar').configure {
    destinationDirectory.set(layout.buildDirectory.dir('validation/packaged'))
}
if ((findProperty('enable_setworks_validation') ?: 'false').toString().toBoolean()) {
    if (!(propertyString('integration_runtime_profile') in ['setworks', 'setworks-crafttweaker', 'all'])) {
        throw new GradleException('Setworks validation requires a Setworks profile with JAWMS API 1.9')
    }
    ['runClient', 'runServer'].each { taskName ->
        tasks.named(taskName, JavaExec).configure {
            dependsOn setworksValidationJar
            classpath += files(setworksValidationJar.flatMap { it.archiveFile })
        }
    }
}

tasks.named('compileStatusworksValidationJava', JavaCompile).configure {
    source file('dev/statusworks-proof/src/main/java/example/statusworksproof/mixin/AcceptedManaObserver.java')
    options.compilerArgs += ['-proc:none']
}
def statusworksValidationJar = tasks.register('statusworksValidationJar', Jar) {
    dependsOn tasks.named('statusworksValidationClasses')
    archiveBaseName.set('jawmsint-authoring-validation')
    archiveVersion.set('dev')
    destinationDirectory.set(layout.buildDirectory.dir('validation'))
    from sourceSets.statusworksValidation.output
    from file('dev/statusworks-proof/src/main/resources/mixins.statusworks-proof.json')
    manifest.attributes('MixinConfigs': 'mixins.statusworks-proof.json')
}
if ((findProperty('enable_statusworks_validation') ?: 'false').toString().toBoolean()) {
    if (!(propertyString('integration_runtime_profile') in ['none', 'statusworks', 'statusworks-legacy',
            'statusworks-crafttweaker', 'statusworks-setworks'])) {
        throw new GradleException('Statusworks authoring validation requires an isolated Statusworks profile')
    }
    ['runClient', 'runServer'].each { taskName ->
        tasks.named(taskName, JavaExec).configure {
            dependsOn statusworksValidationJar
            classpath += files(statusworksValidationJar.flatMap { it.archiveFile })
        }
    }
}

tasks.named('compileStatusworksReplayJava', JavaCompile).configure {
    sourceCompatibility = targetCompatibility = 8
    options.compilerArgs += ['-proc:none']
}
def statusworksReplayJar = tasks.register('statusworksReplayJar', Jar) {
    dependsOn tasks.named('statusworksReplayClasses')
    archiveBaseName.set('jawmsint-statusworks-replay')
    archiveVersion.set('dev')
    destinationDirectory.set(layout.buildDirectory.dir('validation'))
    from sourceSets.statusworksReplay.output
    manifest.attributes('MixinConfigs': 'mixins.statusworks-proof.json,mixins.statusworks-replay.json')
}
if ((findProperty('enable_statusworks_replay') ?: 'false').toString().toBoolean()) {
    if (propertyString('integration_runtime_profile') != 'statusworks') {
        throw new GradleException('Statusworks production replay requires the isolated Statusworks profile')
    }
    ['runClient', 'runServer'].each { taskName ->
        tasks.named(taskName, JavaExec).configure {
            dependsOn statusworksReplayJar
            classpath += files(statusworksReplayJar.flatMap { it.archiveFile })
            jvmArgs '-DstatusworksProof.enabled=true', '-DstatusworksProof.productionReplay=true'
        }
    }
}
