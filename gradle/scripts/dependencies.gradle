    if (propertyBool('enable_agent_test_toolkit')) {
        runtimeOnly rfg.deobf(files(verifiedDevelopmentTool('Agent Test Toolkit',
                'agent_test_toolkit_path', 'agent_test_toolkit_sha256')))
