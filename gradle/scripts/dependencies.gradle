tasks.register('verifyPackagedRuntimeProfile') {
    group = 'jawms integrations verification'
    description = 'Verifies the selected optional integrations in the packaged obfuscated mods folder.'
    inputs.property 'integrationRuntimeProfile', integrationRuntimeProfile
    dependsOn tasks.named('prepareObfModsFolder')
    dependsOn tasks.named('preparePackagedAgentTestToolkitRuntime')
    dependsOn tasks.named('preparePackagedJawmsDeveloperToolsRuntime')
    doLast {
        def mismatches = runtimeMismatches(packagedRuntimeCounts(), true, true)
        if (!mismatches.empty) {
            throw new GradleException("Packaged runtime profile '${integrationRuntimeProfile}' is invalid: "
                    + mismatches.join('; '))
        }
        logger.lifecycle("Verified packaged runtime profile '${integrationRuntimeProfile}'")
    }
}

