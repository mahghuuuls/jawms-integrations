def verifiedDevelopmentTool = { String label, String pathProperty, String checksumProperty ->
    def toolJar = file(propertyString(pathProperty))
    if (!toolJar.isFile()) {
        throw new GradleException("${label} JAR not found: ${toolJar.absolutePath}")
    }
    def actual = java.security.MessageDigest.getInstance('SHA-256')
            .digest(toolJar.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
    def expected = propertyString(checksumProperty).toUpperCase(Locale.ROOT)
    if (actual != expected) {
        throw new GradleException("${label} SHA-256 mismatch: expected ${expected}, found ${actual}")
    }
    toolJar
}

