import org.gradle.api.attributes.Attribute

apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    exclusiveContent {
        forRepository {
            maven {
                name 'CleanroomMC CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal() // Must be last for caching to work
}

configurations {
    shade
    implementation.extendsFrom shade
    qualityToolsContract {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    jawmsContract {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    ancientSpellcraftContract {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    craftTweakerContract {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    arsMagicaContract {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    ancientSpellcraftRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    ancientSpellcraftPackagedRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    optionalPackagedRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def integrationRuntimeProfile = propertyString('integration_runtime_profile').toLowerCase(Locale.ROOT)
def supportedIntegrationRuntimeProfiles = [
        'none', 'qualitytools', 'ancientspellcraft', 'crafttweaker', 'arsmagica', 'both', 'all'
]
if (!supportedIntegrationRuntimeProfiles.contains(integrationRuntimeProfile)) {
    throw new GradleException("Unsupported integration_runtime_profile '${integrationRuntimeProfile}'. "
            + "Expected one of: ${supportedIntegrationRuntimeProfiles.join(', ')}")
}

def qualityToolsRuntimeEnabled = integrationRuntimeProfile in ['qualitytools', 'both', 'all']
def ancientSpellcraftRuntimeEnabled = integrationRuntimeProfile in ['ancientspellcraft', 'both', 'all']
def craftTweakerRuntimeEnabled = integrationRuntimeProfile in ['crafttweaker', 'all']
def arsMagicaRuntimeEnabled = integrationRuntimeProfile in ['arsmagica', 'all']

dependencies {
    // Include StripLatestForgeRequirements by default for the dev env, saves everyone a hassle
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    // Required product dependencies. CurseMaven does not supply their dependency chains transitively.
    implementation rfg.deobf('curse.maven:just-another-wizardry-mana-system-1643697:8703384')
    jawmsContract 'curse.maven:just-another-wizardry-mana-system-1643697:8703384'
    implementation rfg.deobf('curse.maven:electroblobs-wizardry-265642:8320066')
    implementation rfg.deobf('curse.maven:baubles-227083:2518667')

    // Optional integrations compile against exact targets but enter only their selected dev runtime.
    compileOnly rfg.deobf('curse.maven:quality-tools-264756:2732994')
    testImplementation rfg.deobf('curse.maven:quality-tools-264756:2732994')
    qualityToolsContract 'curse.maven:quality-tools-264756:2732994'
    if (qualityToolsRuntimeEnabled) {
        runtimeOnly rfg.deobf('curse.maven:quality-tools-264756:2732994')
        runtimeOnly rfg.deobf('curse.maven:potion-core-242872:2905184')
    }

    compileOnly rfg.deobf('curse.maven:ancient-spellcraft-358124:8555709')
    testImplementation rfg.deobf('curse.maven:ancient-spellcraft-358124:8555709')
    ancientSpellcraftContract 'curse.maven:ancient-spellcraft-358124:8555709'
    if (ancientSpellcraftRuntimeEnabled) {
        // Ancient Spellcraft declares both TweakClass and FMLCorePlugin. Keeping its
        // deobfuscated JAR out of the launch classpath lets MixinBooter load that
        // packaged-mod topology without creating a second Mixin classloader.
        ancientSpellcraftRuntimeMods rfg.deobf('curse.maven:ancient-spellcraft-358124:8555709')
        ancientSpellcraftRuntimeMods rfg.deobf('curse.maven:wizardryutils-608287:7158305')
        ancientSpellcraftPackagedRuntimeMods 'curse.maven:ancient-spellcraft-358124:8555709'
        ancientSpellcraftPackagedRuntimeMods 'curse.maven:wizardryutils-608287:7158305'
    }

    // These exact optional targets are linked only by their later isolated modules.
    // CraftTweaker's released development-facing archive is already suitable for
    // compilation and fails RFG's Minecraft deobfuscation transform.
    compileOnly 'curse.maven:crafttweaker-239197:8051578'
    testImplementation 'curse.maven:crafttweaker-239197:8051578'
    craftTweakerContract 'curse.maven:crafttweaker-239197:8051578'
    if (craftTweakerRuntimeEnabled) {
        runtimeOnly 'curse.maven:crafttweaker-239197:8051578'
        optionalPackagedRuntimeMods 'curse.maven:crafttweaker-239197:8051578'
    }

    compileOnly rfg.deobf('curse.maven:ars-magica-2-rekindled-1430906:8314968')
    testImplementation rfg.deobf('curse.maven:ars-magica-2-rekindled-1430906:8314968')
    arsMagicaContract 'curse.maven:ars-magica-2-rekindled-1430906:8314968'
    if (arsMagicaRuntimeEnabled) {
        runtimeOnly rfg.deobf('curse.maven:ars-magica-2-rekindled-1430906:8314968')
        optionalPackagedRuntimeMods 'curse.maven:ars-magica-2-rekindled-1430906:8314968'
    }

    testImplementation 'org.ow2.asm:asm:5.2'

    if (propertyBool('enable_agent_test_toolkit')) {
        def toolkitJar = file(propertyString('agent_test_toolkit_path'))
        if (!toolkitJar.isFile()) {
            throw new GradleException("Agent Test Toolkit JAR not found: ${toolkitJar.absolutePath}")
        }
        def actualToolkitSha256 = java.security.MessageDigest.getInstance('SHA-256')
                .digest(toolkitJar.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        def expectedToolkitSha256 = propertyString('agent_test_toolkit_sha256').toUpperCase(Locale.ROOT)
        if (actualToolkitSha256 != expectedToolkitSha256) {
            throw new GradleException("Agent Test Toolkit SHA-256 mismatch: expected "
                    + "${expectedToolkitSha256}, found ${actualToolkitSha256}")
        }
        runtimeOnly rfg.deobf(files(toolkitJar))
    }

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - Deobfuscating dependencies:
    // rfg.deobf('curse.maven:had-enough-items-557549:4543375')
    // By wrapping a dependency descriptor in rfg.deobf() method call, the dependency is queued for deobfuscation
    // When deobfuscating, RFG respects the mapping_channel + mapping_version stated in gradle.properties

    // Example - Shading dependencies:
    // Using the shadow plugin, by using the "shade" configuration, the dependency will be shaded into your output jar
    // shade 'mezz:jei:4.31.2' << will shade HadEnoughItems 4.31.2 directly into your jar
    // For more configuration options: see the bottom of this file and: https://gradleup.com/shadow/configuration/

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Common dependency types (configuration):
    // implementation = dependency available at both compile time and runtime
    // runtimeOnly = runtime dependency
    // compileOnly = compile time dependency
    // annotationProcessor = annotation processing dependencies
    // shade = includes dependency in output

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }
}

def obfuscationAttribute = configurations.qualityToolsContract.attributes.keySet().find {
    it.name == 'com.gtnewhorizons.retrofuturagradle.obfuscation'
}
def transformedAttribute = Attribute.of('rfgDeobfuscatorTransformed', Boolean)
if (obfuscationAttribute == null) {
    throw new GradleException('RetroFuturaGradle obfuscation attribute is unavailable for raw contract resolution')
}
// RFG requests MCP-transformed artifacts for normal development configurations.
// Contract tests instead hash and inspect the exact released bytes from CurseMaven.
[configurations.jawmsContract,
 configurations.qualityToolsContract,
 configurations.ancientSpellcraftContract,
 configurations.craftTweakerContract,
 configurations.arsMagicaContract,
 configurations.optionalPackagedRuntimeMods,
 configurations.ancientSpellcraftPackagedRuntimeMods].each { configuration ->
    configuration.attributes {
        attribute obfuscationAttribute,
                objects.named(obfuscationAttribute.type, 'no-minecraft')
        attribute transformedAttribute, false
    }
}

tasks.register('cleanManagedPackagedRuntimeArtifacts') {
    group = 'jawms integrations verification'
    description = 'Removes generated product and known integration artifacts before preparing an isolated packaged profile.'
    doLast {
        def managedFiles = fileTree(layout.projectDirectory.dir('run/obfuscated/mods')) {
            include '**/*.jar'
        }.files.findAll { file ->
            def name = file.name.toLowerCase(Locale.ROOT)
            name.contains('jawms-integrations')
                    || name.contains('just-another-wizardry')
                    || name.contains('qualitytools') || name.contains('quality-tools')
                    || name.contains('potioncore') || name.contains('potion-core')
                    || name.contains('ancientspellcraft') || name.contains('ancient-spellcraft')
                    || name.contains('wizardryutils')
                    || name.contains('crafttweaker')
                    || name.contains('ars-magica') || name.contains('arsmagica')
        }
        delete managedFiles
    }
}

def packagedRuntimeCounts = {
    def runtimeNames = fileTree(layout.projectDirectory.dir('run/obfuscated/mods')) {
        include '**/*.jar'
    }.files.collect { it.name.toLowerCase(Locale.ROOT) }
    def countMatches = { Closure<Boolean> predicate -> runtimeNames.count(predicate) }
    [
            qualityTools: countMatches { it.contains('qualitytools') || it.contains('quality-tools') },
            potionCore: countMatches { it.contains('potioncore') || it.contains('potion-core') },
            ancientSpellcraft: countMatches {
                it.contains('ancientspellcraft') || it.contains('ancient-spellcraft')
            },
            wizardryUtils: countMatches { it.contains('wizardryutils') },
            craftTweaker: countMatches { it.contains('crafttweaker') },
            arsMagica: countMatches { it.contains('ars-magica') || it.contains('arsmagica') },
            jawms: countMatches { it.contains('just-another-wizardry') },
            product: countMatches { it.contains('jawms-integrations') }
    ]
}

def packagedRuntimeMismatches = { Map counts, boolean requireComplete ->
    def mismatches = []
    def check = { String label, int actual, boolean enabled ->
        int maximum = enabled ? 1 : 0
        if (actual > maximum || (requireComplete && actual != maximum)) {
            mismatches << "${label} count=${actual}"
        }
    }
    check('JAWMS', counts.jawms, true)
    check('JAWMS Integrations', counts.product, true)
    check('Quality Tools', counts.qualityTools, qualityToolsRuntimeEnabled)
    check('Potion Core', counts.potionCore, qualityToolsRuntimeEnabled)
    check('Ancient Spellcraft', counts.ancientSpellcraft, ancientSpellcraftRuntimeEnabled)
    check('WizardryUtils', counts.wizardryUtils, ancientSpellcraftRuntimeEnabled)
    check('CraftTweaker', counts.craftTweaker, craftTweakerRuntimeEnabled)
    check('Ars Magica', counts.arsMagica, arsMagicaRuntimeEnabled)
    mismatches
}

tasks.register('verifyNoStalePackagedRuntimeArtifacts') {
    group = 'jawms integrations verification'
    description = 'Fails before preparation when stale or duplicate managed packaged artifacts are present.'
    inputs.property 'integrationRuntimeProfile', integrationRuntimeProfile
    doLast {
        def mismatches = packagedRuntimeMismatches(packagedRuntimeCounts(), false)
        if (!mismatches.empty) {
            throw new GradleException("Packaged runtime profile '${integrationRuntimeProfile}' contains stale "
                    + "or duplicate managed artifacts before preparation: ${mismatches.join('; ')}. "
                    + "Run cleanManagedPackagedRuntimeArtifacts explicitly to reset the profile.")
        }
    }
}
tasks.named('verifyNoStalePackagedRuntimeArtifacts').configure {
    mustRunAfter tasks.named('cleanManagedPackagedRuntimeArtifacts')
}

tasks.named('prepareObfModsFolder', Copy).configure {
    dependsOn tasks.named('verifyNoStalePackagedRuntimeArtifacts')
    if (ancientSpellcraftRuntimeEnabled) {
        from configurations.ancientSpellcraftPackagedRuntimeMods
    }
    from configurations.optionalPackagedRuntimeMods
}

tasks.register('verifyPackagedRuntimeProfile') {
    group = 'jawms integrations verification'
    description = 'Verifies the selected optional integrations in the packaged obfuscated mods folder.'
    inputs.property 'integrationRuntimeProfile', integrationRuntimeProfile
    dependsOn tasks.named('prepareObfModsFolder')
    doLast {
        def mismatches = packagedRuntimeMismatches(packagedRuntimeCounts(), true)
        if (!mismatches.empty) {
            throw new GradleException("Packaged runtime profile '${integrationRuntimeProfile}' is invalid: "
                    + mismatches.join('; '))
        }
        logger.lifecycle("Verified packaged runtime profile '${integrationRuntimeProfile}'")
    }
}

['runObfClient', 'runObfServer'].each { taskName ->
    tasks.named(taskName).configure {
        dependsOn tasks.named('verifyPackagedRuntimeProfile')
    }
}

tasks.named('runObfServer', JavaExec).configure { task ->
    // A canonical game directory prevents MixinBooter and Forge from treating the
    // same packaged Mixin mod as distinct relative and absolute discovery paths.
    args '--gameDir', task.workingDir.canonicalPath
}

tasks.register('prepareAgentTestToolkitRuntime', Sync) {
    group = 'jawms integrations verification'
    description = 'Installs project-owned Agent Test Toolkit configuration and bundles into run/.'
    onlyIf { propertyBool('enable_agent_test_toolkit') }
    from layout.projectDirectory.dir('src/test/resources/validation/agenttesttoolkit')
    into layout.projectDirectory.dir('run/config/devtool')
}

tasks.register('prepareQualityToolsValidationFixtures', Copy) {
    group = 'jawms integrations verification'
    description = 'Installs development-only Quality Tools validation JSON into run/config.'
    onlyIf {
        propertyBool('enable_agent_test_toolkit') && qualityToolsRuntimeEnabled
    }
    from layout.projectDirectory.dir('src/test/resources/validation/qualitytools')
    into layout.projectDirectory.dir('run/config/qualitytools')
}

tasks.register('prepareCraftTweakerDevelopmentValidationScript', Copy) {
    group = 'jawms integrations verification'
    description = 'Installs the compile-only CraftTweaker API contract script into run/scripts.'
    onlyIf { craftTweakerRuntimeEnabled }
    from layout.projectDirectory.dir('src/test/resources/validation/crafttweaker')
    into layout.projectDirectory.dir('run/scripts/jawmsintegrations-validation')
}

tasks.register('prepareCraftTweakerPackagedValidationScript', Copy) {
    group = 'jawms integrations verification'
    description = 'Installs the compile-only CraftTweaker API contract script into the packaged game directory.'
    onlyIf { craftTweakerRuntimeEnabled }
    from layout.projectDirectory.dir('src/test/resources/validation/crafttweaker')
    into layout.projectDirectory.dir('run/obfuscated/scripts/jawmsintegrations-validation')
}

tasks.register('prepareCraftTweakerCampaignScript', Copy) {
    group = 'jawms integrations verification'
    description = 'Installs the development-only CraftTweaker owner-campaign trigger script.'
    onlyIf {
        propertyBool('enable_agent_test_toolkit') && craftTweakerRuntimeEnabled
    }
    from layout.projectDirectory.dir('src/test/resources/validation/crafttweaker-campaign')
    into layout.projectDirectory.dir('run/scripts/jawmsintegrations-validation')
}

tasks.register('prepareArsMagicaDevelopmentValidationConfig', Copy) {
    group = 'jawms integrations verification'
    description = 'Installs the controlled Ars owner-campaign configuration into run/config.'
    onlyIf {
        propertyBool('enable_agent_test_toolkit') && arsMagicaRuntimeEnabled
    }
    from layout.projectDirectory.dir('src/test/resources/validation/arsmagica')
    into layout.projectDirectory.dir('run/config')
}

tasks.register('prepareArsMagicaPackagedValidationConfig', Copy) {
    group = 'jawms integrations verification'
    description = 'Installs the controlled Ars owner-campaign configuration into the packaged game directory.'
    onlyIf {
        propertyBool('enable_agent_test_toolkit') && arsMagicaRuntimeEnabled
    }
    from layout.projectDirectory.dir('src/test/resources/validation/arsmagica')
    into layout.projectDirectory.dir('run/obfuscated/config')
}

['runClient', 'runServer'].each { taskName ->
    tasks.named(taskName).configure {
        dependsOn tasks.named('prepareCraftTweakerDevelopmentValidationScript')
        dependsOn tasks.named('prepareCraftTweakerCampaignScript')
        dependsOn tasks.named('prepareArsMagicaDevelopmentValidationConfig')
    }
}

['runObfClient', 'runObfServer'].each { taskName ->
    tasks.named(taskName).configure {
        dependsOn tasks.named('prepareCraftTweakerPackagedValidationScript')
        dependsOn tasks.named('prepareArsMagicaPackagedValidationConfig')
    }
}

tasks.register('prepareIntegrationRuntimeMods') {
    group = 'jawms integrations verification'
    description = 'Installs the selected classloader-sensitive optional mods into run/mods.'
    outputs.upToDateWhen { false }
    doLast {
        def runtimeModsDirectory = layout.projectDirectory.dir('run/mods').asFile
        def managedAncientSpellcraftJar = new File(runtimeModsDirectory,
                'jawmsintegrations-managed-ancientspellcraft.jar')
        def managedWizardryUtilsJar = new File(runtimeModsDirectory,
                'jawmsintegrations-managed-wizardryutils.jar')
        runtimeModsDirectory.mkdirs()
        delete managedAncientSpellcraftJar, managedWizardryUtilsJar
        if (ancientSpellcraftRuntimeEnabled) {
            configurations.ancientSpellcraftRuntimeMods.files.each { sourceJar ->
                def destinationName = sourceJar.name.toLowerCase(Locale.ROOT).contains('wizardryutils')
                        ? managedWizardryUtilsJar.name
                        : managedAncientSpellcraftJar.name
                copy {
                    from sourceJar
                    into runtimeModsDirectory
                    rename { destinationName }
                }
            }
        }
    }
}

tasks.register('verifyDevelopmentRuntimeProfile') {
    group = 'jawms integrations verification'
    description = 'Verifies that the selected optional integration runtime contains exactly its intended mods.'
    inputs.property 'integrationRuntimeProfile', integrationRuntimeProfile
    inputs.property 'enableAgentTestToolkit', propertyBool('enable_agent_test_toolkit')
    dependsOn tasks.named('prepareIntegrationRuntimeMods')
    doLast {
        def runtimeFiles = new LinkedHashSet<File>(configurations.runtimeClasspath.files)
        runtimeFiles.addAll(fileTree(layout.projectDirectory.dir('run/mods')) {
            include '**/*.jar'
        }.files)
        def runtimeNames = runtimeFiles.collect { it.name.toLowerCase(Locale.ROOT) }
        def countMatches = { Closure<Boolean> predicate -> runtimeNames.count(predicate) }
        def qualityToolsCount = countMatches { it.contains('qualitytools') || it.contains('quality-tools') }
        def potionCoreCount = countMatches { it.contains('potioncore') || it.contains('potion-core') }
        def ancientSpellcraftCount = countMatches {
            it.contains('ancientspellcraft') || it.contains('ancient-spellcraft')
        }
        def wizardryUtilsCount = countMatches { it.contains('wizardryutils') }
        def toolkitCount = countMatches { it.contains('agenttesttoolkit') }
        def jawmsCount = countMatches { it.contains('just-another-wizardry') }
        def craftTweakerCount = countMatches { it.contains('crafttweaker') }
        def arsMagicaCount = countMatches { it.contains('ars-magica') || it.contains('arsmagica') }

        def mismatches = []
        if (jawmsCount != 1) mismatches << "JAWMS count=${jawmsCount}"
        if (qualityToolsCount != (qualityToolsRuntimeEnabled ? 1 : 0)) {
            mismatches << "Quality Tools count=${qualityToolsCount}"
        }
        if (potionCoreCount != (qualityToolsRuntimeEnabled ? 1 : 0)) {
            mismatches << "Potion Core count=${potionCoreCount}"
        }
        if (ancientSpellcraftCount != (ancientSpellcraftRuntimeEnabled ? 1 : 0)) {
            mismatches << "Ancient Spellcraft count=${ancientSpellcraftCount}"
        }
        if (wizardryUtilsCount != (ancientSpellcraftRuntimeEnabled ? 1 : 0)) {
            mismatches << "WizardryUtils count=${wizardryUtilsCount}"
        }
        if (craftTweakerCount != (craftTweakerRuntimeEnabled ? 1 : 0)) {
            mismatches << "CraftTweaker count=${craftTweakerCount}"
        }
        if (arsMagicaCount != (arsMagicaRuntimeEnabled ? 1 : 0)) {
            mismatches << "Ars Magica count=${arsMagicaCount}"
        }
        if (toolkitCount != (propertyBool('enable_agent_test_toolkit') ? 1 : 0)) {
            mismatches << "Agent Test Toolkit count=${toolkitCount}"
        }
        if (!mismatches.empty) {
            throw new GradleException("Development runtime profile '${integrationRuntimeProfile}' is invalid: "
                    + mismatches.join('; '))
        }
        logger.lifecycle("Verified development runtime profile '${integrationRuntimeProfile}' "
                + "(toolkit=${propertyBool('enable_agent_test_toolkit')})")
    }
}

// Need reobfJar to use uber jars, so dependencies that are shaded in are present
// Only redirect reobfJar through shadowJar when there's actually something to shade
if (!configurations.shade.dependencies.empty) {
    tasks.named('reobfJar').configure {
        inputJar.set(tasks.named('shadowJar').flatMap({ it.archiveFile }))
    }
}

// By default, it will use a "uberdev" suffix, and only pack shade configuration dependencies
// Uberdev: dev jar w/ dependencies, NOT a reobfuscated artifact!
// The end result (reobfJar) will have a non-suffixed name, as unlike normal shading envs, reobfJar is the end task
tasks.shadowJar {
    // Shadow wires shadowJar into the assemble task, so it runs even when nothing is shaded
    enabled = !project.configurations.shade.dependencies.empty
    archiveClassifier = 'uberdev'
    configurations = [ project.configurations.shade ]
}
