    }

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - Deobfuscating dependencies:
    // rfg.deobf('curse.maven:had-enough-items-557549:4543375')
    // By wrapping a dependency descriptor in rfg.deobf() method call, the dependency is queued for deobfuscation
    // When deobfuscating, RFG respects the mapping_channel + mapping_version stated in gradle.properties

    // Example - Shading dependencies:
    // Using the shadow plugin, by using the "shade" configuration, the dependency will be shaded into your output jar
    // shade 'mezz:jei:4.31.2' << will shade HadEnoughItems 4.31.2 directly into your jar
    // For more configuration options: see the bottom of this file and: https://gradleup.com/shadow/configuration/

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Common dependency types (configuration):
    // implementation = dependency available at both compile time and runtime
    // runtimeOnly = runtime dependency
    // compileOnly = compile time dependency
    // annotationProcessor = annotation processing dependencies
    // shade = includes dependency in output

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }
}

def obfuscationAttribute = configurations.qualityToolsContract.attributes.keySet().find {
    it.name == 'com.gtnewhorizons.retrofuturagradle.obfuscation'
}
def transformedAttribute = Attribute.of('rfgDeobfuscatorTransformed', Boolean)
if (obfuscationAttribute == null) {
    throw new GradleException('RetroFuturaGradle obfuscation attribute is unavailable for raw contract resolution')
}
// RFG requests MCP-transformed artifacts for normal development configurations.
// Contract tests instead hash and inspect the exact released bytes from CurseMaven.
[configurations.jawmsContract,
 configurations.wizardryContract,
 configurations.qualityToolsContract,
 configurations.ancientSpellcraftContract,
 configurations.craftTweakerContract,
 configurations.jafsContract,
 configurations.jassContract,
 configurations.setworksContract,
 configurations.setworksJawmsContract,
 configurations.optionalPackagedRuntimeMods,
 configurations.ancientSpellcraftPackagedRuntimeMods].each { configuration ->
    configuration.attributes {
        attribute obfuscationAttribute,
                objects.named(obfuscationAttribute.type, 'no-minecraft')
        attribute transformedAttribute, false
    }
}

tasks.register('verifyJafsContractArtifact') {
    group = 'jawms integrations verification'
    description = 'Verifies the exact released JAFS input used by the optional compile and runtime profiles.'
    inputs.files configurations.jafsContract
    inputs.property 'expectedSha256', propertyString('jafs_contract_sha256')
    doLast {
        def artifact = configurations.jafsContract.singleFile
        def actual = java.security.MessageDigest.getInstance('SHA-256')
                .digest(artifact.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        if (actual != propertyString('jafs_contract_sha256').toUpperCase(Locale.ROOT)) {
            throw new GradleException("JAFS contract SHA-256 mismatch: ${artifact.name}, found ${actual}")
        }
        logger.lifecycle("Verified exact JAFS release input ${artifact.name}")
    }
}
tasks.named('check').configure { dependsOn tasks.named('verifyJafsContractArtifact') }

tasks.register('verifySetworksContractArtifacts') {
    group = 'jawms integrations verification'
    description = 'Verifies the exact released Setworks and JAWMS inputs for the Setworks profiles.'
    def contracts = [setworks_contract_sha256: configurations.setworksContract,
                     setworks_jawms_contract_sha256: configurations.setworksJawmsContract]
    contracts.each { checksumProperty, configuration ->
        inputs.files configuration
        inputs.property checksumProperty, propertyString(checksumProperty)
    }
    doLast {
        contracts.each { checksumProperty, configuration ->
            def artifact = configuration.singleFile
            def actual = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(artifact.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
            if (actual != propertyString(checksumProperty).toUpperCase(Locale.ROOT)) {
                throw new GradleException("Setworks contract SHA-256 mismatch: ${artifact.name}, found ${actual}")
            }
            logger.lifecycle("Verified exact Setworks profile input ${artifact.name}")
        }
    }
}
tasks.named('check').configure { dependsOn tasks.named('verifySetworksContractArtifacts') }

// Read declared identities so a renamed optional JAR cannot mask its presence.
def declaredModIds = { File artifact ->
    if (!artifact.isFile() || !artifact.name.toLowerCase(Locale.ROOT).endsWith('.jar')) {
        return [] as Set
    }
    def archive = new JarFile(artifact)
    try {
        def entry = archive.getJarEntry('mcmod.info')
        if (entry == null) return [] as Set
        def metadata = archive.getInputStream(entry).withCloseable { stream ->
            new JsonSlurper().parse(stream)
        }
        def records = metadata instanceof List ? metadata : metadata.modList
        (records ?: []).collect { it.modid?.toString() }.findAll { it != null } as Set
    } finally {
        archive.close()
    }
}
def managedArtifactRules = [
        qualityTools: [id: 'qualitytools', names: ['qualitytools', 'quality-tools']],
        potionCore: [id: 'potioncore', names: ['potioncore', 'potion-core']],
        ancientSpellcraft: [id: 'ancientspellcraft', names: ['ancientspellcraft', 'ancient-spellcraft']],
        wizardryUtils: [id: 'wizardryutils', names: ['wizardryutils']],
        craftTweaker: [id: 'crafttweaker', names: ['crafttweaker']],
        jafs: [id: 'jafs', names: ['jafs-', 'jafs.', 'just-another-food-system']],
        jass: [id: 'jass', names: ['jass-', 'just-another-stamina-system']],
        setworks: [id: 'setworks', names: ['setworks-']],
        toolkit: [id: 'agenttesttoolkit', names: ['agenttesttoolkit']],
        developerTools: [id: 'jawms_devtools', names: ['jawms-devtools']],
        jawms: [id: 'jawms', names: ['jawms-', 'just-another-wizardry']],
        product: [id: 'jawmsintegrations', names: ['jawms-integrations']],
        rejectedArsPrototype: [id: 'arsmagica2', names: ['ars-magica', 'arsmagica']]
]
def managedArtifactKinds = { File artifact ->
    if (!artifact.isFile() || !artifact.name.toLowerCase(Locale.ROOT).endsWith('.jar')) {
        return [] as Set
    }
    def ids = declaredModIds(artifact)
    def name = artifact.name.toLowerCase(Locale.ROOT)
    // Published metadata is authoritative; filename fallback identifies older
    // managed files that carry no metadata, without misclassifying an addon.
    managedArtifactRules.findAll { kind, rule ->
        ids.empty ? rule.names.any { name.contains(it) } : ids.contains(rule.id)
    }.keySet()
}
def managedRuntimeCounts = { Collection<File> files ->
    def kinds = files.collect { managedArtifactKinds(it) }
    managedArtifactRules.collectEntries { kind, rule ->
        [(kind): kinds.count { it.contains(kind) }]
    }
}
def runtimeMismatches = { Map counts, boolean requireComplete, boolean packaged ->
    def expected = [
            qualityTools: ['Quality Tools', qualityToolsRuntimeEnabled],
            potionCore: ['Potion Core', qualityToolsRuntimeEnabled],
            ancientSpellcraft: ['Ancient Spellcraft', ancientSpellcraftRuntimeEnabled],
            wizardryUtils: ['WizardryUtils', ancientSpellcraftRuntimeEnabled],
            craftTweaker: ['CraftTweaker', craftTweakerRuntimeEnabled],
            jafs: ['JAFS', jafsRuntimeEnabled],
            jass: ['JASS', jassRuntimeEnabled],
            setworks: ['Setworks', setworksRuntimeEnabled],
            toolkit: ['Agent Test Toolkit', propertyBool('enable_agent_test_toolkit')],
            developerTools: ['JAWMS Developer Tools', propertyBool('enable_jawms_developer_tools')],
            jawms: ['JAWMS', true],
            product: ['JAWMS Integrations', packaged],
            rejectedArsPrototype: ['Rejected Ars prototype artifact', false]
    ]
    def mismatches = []
    expected.each { kind, selection ->
        int wanted = selection[1] ? 1 : 0
        int actual = counts[kind]
        if (actual > wanted || (requireComplete && actual != wanted)) {
            mismatches << selection[0] + ' count=' + actual
        }
    }
    mismatches
}
tasks.register('cleanManagedPackagedRuntimeArtifacts') {
    group = 'jawms integrations verification'
    description = 'Removes generated product and known integration artifacts before preparing an isolated packaged profile.'
    doLast {
        def managedFiles = fileTree(layout.projectDirectory.dir('run/obfuscated/mods')) {
            include '**/*.jar'
        }.files.findAll { !managedArtifactKinds(it).empty }
        delete managedFiles
        delete layout.projectDirectory.dir('run/obfuscated/config/devtool')
        delete layout.projectDirectory.file(
                'run/obfuscated/config/qualitytools/Quailities/jawms-integrations-validation.json')
        delete layout.projectDirectory.dir('run/obfuscated/scripts/jawmsintegrations-validation')
    }
}

def packagedRuntimeCounts = {
    managedRuntimeCounts(fileTree(layout.projectDirectory.dir('run/obfuscated/mods')) {
        include '**/*.jar'
    }.files)
}
tasks.register('verifyNoStalePackagedRuntimeArtifacts') {
    group = 'jawms integrations verification'
    description = 'Fails before preparation when stale or duplicate managed packaged artifacts are present.'
    inputs.property 'integrationRuntimeProfile', integrationRuntimeProfile
    doLast {
        def mismatches = runtimeMismatches(packagedRuntimeCounts(), false, true)
        if (!mismatches.empty) {
            throw new GradleException("Packaged runtime profile '${integrationRuntimeProfile}' contains stale "
                    + "or duplicate managed artifacts before preparation: ${mismatches.join('; ')}. "
                    + "Run cleanManagedPackagedRuntimeArtifacts explicitly to reset the profile.")
        }
    }
}
tasks.named('verifyNoStalePackagedRuntimeArtifacts').configure {
    mustRunAfter tasks.named('cleanManagedPackagedRuntimeArtifacts')
}

tasks.named('prepareObfModsFolder', Copy).configure {
    dependsOn tasks.named('verifyNoStalePackagedRuntimeArtifacts')
    if (ancientSpellcraftRuntimeEnabled) {
        from configurations.ancientSpellcraftPackagedRuntimeMods
    }
    from configurations.optionalPackagedRuntimeMods
}

